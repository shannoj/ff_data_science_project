name: Weekly model update

# Tuesday: retrain on last week's results and project the next week.
# Saturday: refresh projections for unplayed games with the latest starters,
# lines and weather. Games already played keep their original projection.
on:
  schedule:
    - cron: "0 12 * * 2"   # Tuesday 12:00 UTC
    - cron: "0 14 * * 6"   # Saturday 14:00 UTC
  workflow_dispatch:
    inputs:
      retrain:
        description: "Retrain the model"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.retrain }}" = "false" ]; then
            python pipeline.py --no-train
          elif [ "${{ github.event.schedule }}" = "0 14 * * 6" ]; then
            python pipeline.py --no-train
          else
            python pipeline.py
          fi

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add artifacts predictions
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly model update: $(date -u +%Y-%m-%d)"
            git push
          fi
