name: Model update and auto-bet

# Tuesday: retrain on last week's results and project the next week.
# Daily: refresh projections for unplayed games (latest starters, lines and
# weather; games already played keep their original projection) and log
# sportsbook lines + paper bets for games starting in the next 36 hours.
on:
  schedule:
    - cron: "0 12 * * 2"   # Tuesday 12:00 UTC: retrain
    - cron: "0 15 * * *"   # Daily 15:00 UTC (10-11am ET): refresh + auto-bet
  workflow_dispatch:
    inputs:
      retrain:
        description: "Retrain the model"
        type: boolean
        default: true
      report:
        description: "Post the weekly report issue"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.retrain }}" = "false" ]; then
            python pipeline.py --no-train
          elif [ "${{ github.event.schedule }}" = "0 15 * * *" ]; then
            python pipeline.py --no-train
          else
            python pipeline.py
          fi

      - name: Log lines and paper bets
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python autobet.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add artifacts predictions experiment
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly model update: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Post weekly report
        if: github.event.schedule == '0 12 * * 2' || (github.event_name == 'workflow_dispatch' && inputs.report)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(python weekly_report.py report.md | tail -n 1)
          if [ ! -f report.md ]; then
            echo "Nothing to report yet."
            exit 0
          fi
          for n in $(gh issue list --state open --search "Auto-bet report in:title" --json number -q '.[].number'); do
            gh issue close "$n" --comment "Superseded by the latest weekly report."
          done
          gh issue create --title "$title" --body-file report.md
